<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 700" width="970" height="700">
  <defs>
    <radialGradient id="bg-glow-snap" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFC00" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#161603" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020408" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="card-border-snap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFFC00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="white" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect width="970" height="700" rx="44" fill="url(#bg-glow-snap)" />
  <rect width="970" height="700" rx="44" fill="none" stroke="url(#card-border-snap)" stroke-width="4" />

  <!-- Center Floating Icon Badge Container -->
  <g transform="translate(485, 290)">
    <!-- Icon Disk Background -->
    <circle cx="0" cy="0" r="140" fill="#000000" opacity="0.6" stroke="#FFFC00" stroke-width="3" stroke-opacity="0.45" />
    <circle cx="0" cy="0" r="125" fill="#FFFC00" opacity="0.15" />

    <!-- Center SVG Icon scaled up 4.6x from 64x56 coordinate box -->
    <g transform="translate(-147, -128) scale(4.6)">
      <rect x="15" y="12" width="34" height="32" rx="8" fill="#FFFC00"/><path d="M32 17c-4 0-7 3-7 7 0 2 .5 3 .5 3s-1.5 1-2.5 2c-.5.5 0 1 .5 1 1 0 2-.5 3-.5s1.5 1 5.5 1 5-1 5.5-1 2 .5 3 .5c.5 0 1-.5.5-1-1-1-2.5-2-2.5-2s.5-1 .5-3c0-4-3-7-7-7z" fill="white" stroke="#000" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Title & Subtitle Badge -->
  <g transform="translate(485, 545)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">SNAPCHAT</text>
    
    <rect x="-260" y="24" width="520" height="46" rx="23" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" />
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">Instant AR Lenses & Snaps</text>
  </g>

  <!-- Top Category Tag -->
  <g transform="translate(60, 65)">
    <rect width="180" height="40" rx="20" fill="#FFFC00" fill-opacity="0.25" stroke="#FFFC00" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="24" cy="20" r="6" fill="#FFFC00" />
    <text x="40" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="white" letter-spacing="1.2">ULTRA SPEED</text>
  </g>
</svg>