<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 700" width="970" height="700">
  <defs>
    <radialGradient id="bg-glow-inst" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#160410" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020408" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="card-border-inst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#E1306C" stop-opacity="0.4" />
      <stop offset="100%" stop-color="white" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect width="970" height="700" rx="44" fill="url(#bg-glow-inst)" />
  <rect width="970" height="700" rx="44" fill="none" stroke="url(#card-border-inst)" stroke-width="4" />

  <!-- Center Floating Icon Badge Container -->
  <g transform="translate(485, 290)">
    <!-- Icon Disk Background -->
    <circle cx="0" cy="0" r="140" fill="#000000" opacity="0.6" stroke="#E1306C" stroke-width="3" stroke-opacity="0.45" />
    <circle cx="0" cy="0" r="125" fill="#E1306C" opacity="0.15" />

    <!-- Center SVG Icon scaled up 4.6x from 64x56 coordinate box -->
    <g transform="translate(-147, -128) scale(4.6)">
      <defs><linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFDC80"/><stop offset="50%" stop-color="#FD1D1D"/><stop offset="100%" stop-color="#833AB4"/></linearGradient></defs><rect x="16" y="12" width="32" height="32" rx="10" fill="url(#ig)"/><circle cx="32" cy="28" r="7" stroke="white" stroke-width="2.5" fill="none"/><circle cx="41" cy="19" r="1.8" fill="white"/>
    </g>
  </g>

  <!-- Title & Subtitle Badge -->
  <g transform="translate(485, 545)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">INSTAGRAM</text>
    
    <rect x="-260" y="24" width="520" height="46" rx="23" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" />
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">Reels, Stories & Live</text>
  </g>

  <!-- Top Category Tag -->
  <g transform="translate(60, 65)">
    <rect width="180" height="40" rx="20" fill="#E1306C" fill-opacity="0.25" stroke="#E1306C" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="24" cy="20" r="6" fill="#E1306C" />
    <text x="40" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="white" letter-spacing="1.2">ULTRA SPEED</text>
  </g>
</svg>