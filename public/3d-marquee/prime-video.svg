<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 700" width="970" height="700">
  <defs>
    <radialGradient id="bg-glow-prim" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#00A8E1" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#03101C" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020408" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="card-border-prim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00A8E1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="white" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect width="970" height="700" rx="44" fill="url(#bg-glow-prim)" />
  <rect width="970" height="700" rx="44" fill="none" stroke="url(#card-border-prim)" stroke-width="4" />

  <!-- Center Floating Icon Badge Container -->
  <g transform="translate(485, 290)">
    <!-- Icon Disk Background -->
    <circle cx="0" cy="0" r="140" fill="#000000" opacity="0.6" stroke="#00A8E1" stroke-width="3" stroke-opacity="0.45" />
    <circle cx="0" cy="0" r="125" fill="#00A8E1" opacity="0.15" />

    <!-- Center SVG Icon scaled up 4.6x from 64x56 coordinate box -->
    <g transform="translate(-147, -128) scale(4.6)">
      <path d="M12 28c8 4 24 5 36 0" stroke="#00A8E1" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M44 26l5 2-3 5" fill="#00A8E1" stroke="#00A8E1" stroke-width="1.5" stroke-linejoin="round"/><text x="32" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">prime</text>
    </g>
  </g>

  <!-- Title & Subtitle Badge -->
  <g transform="translate(485, 545)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">PRIME VIDEO</text>
    
    <rect x="-260" y="24" width="520" height="46" rx="23" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" />
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">Originals in 4K • HDR10+</text>
  </g>

  <!-- Top Category Tag -->
  <g transform="translate(60, 65)">
    <rect width="180" height="40" rx="20" fill="#00A8E1" fill-opacity="0.25" stroke="#00A8E1" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="24" cy="20" r="6" fill="#00A8E1" />
    <text x="40" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="white" letter-spacing="1.2">ULTRA SPEED</text>
  </g>
