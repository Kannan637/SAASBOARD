<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <filter id="shadcnCardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#010D3B" flood-opacity="0.08" />
    </filter>
    <filter id="thumbShadow" x="-40%" y="-40%" width="180%" height="180%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#010D3B" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Single Apple/shadcn Card Component with 28px squircle radius -->
  <rect x="40" y="30" width="720" height="440" rx="28" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.5" filter="url(#shadcnCardShadow)" />

  <!-- CardHeader: Eyebrow, Title, Subtitle & Price Lock Badge -->
  <rect x="70" y="56" width="168" height="26" rx="13" fill="#FDEBEB" />
  <text x="154" y="73" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="11" font-weight="600" fill="#DE0302" letter-spacing="0.5">ON-DEMAND BANDWIDTH</text>

  <text x="70" y="112" font-family="Urbanist, system-ui, sans-serif" font-size="22" font-weight="600" fill="#010D3B">Business Bandwidth Scaler</text>
  <text x="70" y="134" font-family="Urbanist, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4A4F63">Scale bandwidth instantly with priority QoS &amp; 2-year price protection</text>

  <!-- Price Lock Status Badge (Right Header) -->
  <rect x="584" y="56" width="146" height="32" rx="16" fill="#010D3B" />
  <text x="657" y="76" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">2-Yr Tariff Protected</text>

  <!-- Card Separator Line -->
  <line x1="70" y1="154" x2="730" y2="154" stroke="#E2E5EE" stroke-width="1" />

  <!-- Primary Metric: Active Bandwidth Allocation -->
  <text x="70" y="218" font-family="Urbanist, system-ui, sans-serif" font-size="54" font-weight="700" fill="#010D3B">300</text>
  <text x="176" y="218" font-family="Urbanist, system-ui, sans-serif" font-size="26" font-weight="600" fill="#DE0302">Mbps</text>
  <text x="70" y="244" font-family="Urbanist, system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4F63">Active SME Allocation  •  Engineered for Up to 50 Concurrent Devices</text>

  <!-- Interactive shadcn/ui Slider Control -->
  <!-- Slider Track -->
  <rect x="70" y="280" width="660" height="12" rx="6" fill="#F3F4F7" />
  <!-- Slider Active Range Fill -->
  <rect x="70" y="280" width="360" height="12" rx="6" fill="#DE0302" />

  <!-- Slider Thumb with Active Ring -->
  <circle cx="430" cy="286" r="14" fill="#FFFFFF" stroke="#DE0302" stroke-width="4.5" filter="url(#thumbShadow)" />
  <circle cx="430" cy="286" r="4.5" fill="#010D3B" />

  <!-- Slider Tick Marks & Step Labels -->
  <circle cx="76" cy="286" r="2.5" fill="#FFFFFF" />
  <circle cx="250" cy="286" r="2.5" fill="#FFFFFF" />
  <circle cx="430" cy="286" r="2" fill="#FFFFFF" opacity="0" />
  <circle cx="580" cy="286" r="2.5" fill="#4A4F63" opacity="0.4" />
  <circle cx="724" cy="286" r="2.5" fill="#4A4F63" opacity="0.4" />

  <text x="70" y="322" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4A4F63">100 Mbps</text>
  <text x="430" y="322" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="13" font-weight="700" fill="#DE0302">300 Mbps (Growth)</text>
  <text x="580" y="322" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4A4F63">500 Mbps</text>
  <text x="730" y="322" text-anchor="end" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="500" fill="#4A4F63">1 Gbps</text>

  <!-- Bottom Feature Badges Row -->
  <rect x="70" y="374" width="206" height="34" rx="10" fill="#F3F4F7" />
  <text x="173" y="395" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#010D3B">✓ POS &amp; Cloud ERP Priority</text>

  <rect x="290" y="374" width="204" height="34" rx="10" fill="#F3F4F7" />
  <text x="392" y="395" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#010D3B">✓ Zero FUP Throttling</text>

  <rect x="508" y="374" width="222" height="34" rx="10" fill="#F3F4F7" />
  <text x="619" y="395" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#010D3B">✓ Wi-Fi 6 Router Included</text>
</svg>
