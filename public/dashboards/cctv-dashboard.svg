<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <filter id="shadcnCardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#010D3B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Single Apple/shadcn Card Component with 28px squircle radius -->
  <rect x="40" y="30" width="720" height="440" rx="28" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.5" filter="url(#shadcnCardShadow)" />

  <!-- CardHeader: Eyebrow, Title, Subtitle & Live Status Badge -->
  <rect x="70" y="56" width="186" height="26" rx="13" fill="#FDEBEB" />
  <text x="163" y="73" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="11" font-weight="600" fill="#DE0302" letter-spacing="0.5">24/7 PREMISES SURVEILLANCE</text>

  <text x="70" y="112" font-family="Urbanist, system-ui, sans-serif" font-size="22" font-weight="600" fill="#010D3B">Commercial IP Camera Console</text>
  <text x="70" y="134" font-family="Urbanist, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4A4F63">30-Day NVR cloud retention with AI perimeter detection &amp; live mobile streaming</text>

  <!-- Live Recording Indicator Badge (Right Header) -->
  <rect x="576" y="56" width="154" height="32" rx="16" fill="#FDEBEB" />
  <circle cx="594" cy="72" r="4.5" fill="#DE0302" />
  <text x="608" y="76" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#DE0302">16 / 16 Cameras Live</text>

  <!-- Card Separator Line -->
  <line x1="70" y1="154" x2="730" y2="154" stroke="#E2E5EE" stroke-width="1" />

  <!-- The Single Core Element: High-Definition Live Camera Viewport Console -->
  <rect x="70" y="174" width="660" height="236" rx="18" fill="#010D3B" />

  <!-- Video Player Header Overlay inside Viewport -->
  <text x="94" y="206" font-family="Urbanist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">CAM 01 • Main Logistics &amp; Production Facility</text>
  <rect x="618" y="190" width="94" height="22" rx="11" fill="#DE0302" />
  <text x="665" y="205" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">● 4K LIVE REC</text>

  <!-- Perspective Horizon & Grid Lines in Video -->
  <line x1="94" y1="340" x2="686" y2="340" stroke="#1A2552" stroke-width="1.5" />
  <line x1="94" y1="290" x2="686" y2="290" stroke="#1A2552" stroke-width="1" stroke-dasharray="4 4" />
  <path d="M 120 340 L 260 260 M 660 340 L 520 260" stroke="#1A2552" stroke-width="1.5" />

  <!-- AI Smart Detection Bounding Box -->
  <rect x="260" y="235" width="260" height="105" rx="8" stroke="#16A34A" stroke-width="2" stroke-dasharray="8 5" fill="#16A34A" fill-opacity="0.08" />

  <!-- Corner Aim Markers -->
  <path d="M 260 247 L 260 235 L 272 235" stroke="#16A34A" stroke-width="3" fill="none" />
  <path d="M 520 247 L 520 235 L 508 235" stroke="#16A34A" stroke-width="3" fill="none" />
  <path d="M 260 328 L 260 340 L 272 340" stroke="#16A34A" stroke-width="3" fill="none" />
  <path d="M 520 328 L 520 340 L 508 340" stroke="#16A34A" stroke-width="3" fill="none" />

  <!-- AI Detection Label Badge -->
  <rect x="282" y="222" width="216" height="22" rx="5" fill="#16A34A" />
  <text x="390" y="237" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="700" fill="#FFFFFF">AI SMART DETECTION • PERIMETER CLEAR</text>

  <!-- Target Object Silhouette Indicator -->
  <circle cx="390" cy="275" r="14" fill="#FFFFFF" fill-opacity="0.12" stroke="#16A34A" stroke-width="1.5" />
  <path d="M 370 315 C 370 295 410 295 410 315 Z" fill="#FFFFFF" fill-opacity="0.12" />

  <!-- Viewport Telemetry Status Bar -->
  <text x="94" y="388" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="500" fill="#FFFFFF" opacity="0.75">IR NIGHT VISION: ON  |  BITRATE: 8.4 Mbps  |  ENCRYPTION: AES-256  |  RETENTION: 30D</text>

  <!-- Bottom Badges Row -->
  <rect x="70" y="424" width="206" height="30" rx="8" fill="#F3F4F7" />
  <text x="173" y="443" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#010D3B">✓ 30-Day NVR Cloud Backup</text>

  <rect x="290" y="424" width="204" height="30" rx="8" fill="#F3F4F7" />
  <text x="392" y="443" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#010D3B">✓ 99.9% AI Accuracy</text>

  <rect x="508" y="424" width="222" height="30" rx="8" fill="#F3F4F7" />
  <text x="619" y="443" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#010D3B">✓ Live Mobile &amp; Web View</text>
</svg>
