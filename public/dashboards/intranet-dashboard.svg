<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <filter id="shadcnCardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#010D3B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Single Apple/shadcn Card Component with 28px squircle radius -->
  <rect x="40" y="30" width="720" height="440" rx="28" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.5" filter="url(#shadcnCardShadow)" />

  <!-- CardHeader: Eyebrow, Title, Subtitle & Network Status Badge -->
  <rect x="70" y="56" width="162" height="26" rx="13" fill="#FDEBEB" />
  <text x="151" y="73" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="11" font-weight="600" fill="#DE0302" letter-spacing="0.5">PRIVATE OPTICAL WAN</text>

  <text x="70" y="112" font-family="Urbanist, system-ui, sans-serif" font-size="22" font-weight="600" fill="#010D3B">Inter-Branch Network Topology</text>
  <text x="70" y="134" font-family="Urbanist, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4A4F63">Isolated Layer-2 VLAN mesh across Tamil Nadu with zero public web exposure</text>

  <!-- Hub Status Badge (Right Header) -->
  <rect x="588" y="56" width="142" height="32" rx="16" fill="#F3F4F7" stroke="#E2E5EE" stroke-width="1" />
  <circle cx="606" cy="72" r="4.5" fill="#16A34A" />
  <text x="620" y="76" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#010D3B">7 / 7 Hubs Online</text>

  <!-- Card Separator Line -->
  <line x1="70" y1="154" x2="730" y2="154" stroke="#E2E5EE" stroke-width="1" />

  <!-- Primary Metric: Core Inter-Site Latency -->
  <text x="70" y="214" font-family="Urbanist, system-ui, sans-serif" font-size="52" font-weight="700" fill="#010D3B">2.1</text>
  <text x="156" y="214" font-family="Urbanist, system-ui, sans-serif" font-size="26" font-weight="600" fill="#DE0302">ms</text>
  <text x="70" y="238" font-family="Urbanist, system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4F63">Average Inter-Branch Latency  •  Direct Optical Ring</text>

  <!-- Security Protocol Badge -->
  <rect x="548" y="180" width="182" height="28" rx="14" fill="#FDEBEB" />
  <text x="639" y="198" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="11" font-weight="600" fill="#DE0302">AES-256 Hardware Encrypted</text>

  <!-- Optical Mesh Topology Diagram -->
  <!-- Connection Lines from Central HQ Node (400, 320) -->
  <line x1="400" y1="320" x2="160" y2="300" stroke="#010D3B" stroke-width="2.5" stroke-dasharray="6 4" />
  <line x1="400" y1="320" x2="270" y2="400" stroke="#010D3B" stroke-width="2.5" />
  <line x1="400" y1="320" x2="530" y2="400" stroke="#010D3B" stroke-width="2.5" />
  <line x1="400" y1="320" x2="640" y2="300" stroke="#010D3B" stroke-width="2.5" stroke-dasharray="6 4" />

  <!-- Outer Ring Interconnects between Branches -->
  <line x1="160" y1="300" x2="270" y2="400" stroke="#E2E5EE" stroke-width="1.5" />
  <line x1="270" y1="400" x2="530" y2="400" stroke="#E2E5EE" stroke-width="1.5" />
  <line x1="530" y1="400" x2="640" y2="300" stroke="#E2E5EE" stroke-width="1.5" />

  <!-- Central HQ Node -->
  <circle cx="400" cy="320" r="38" fill="#FDEBEB" />
  <circle cx="400" cy="320" r="28" fill="#010D3B" />
  <circle cx="400" cy="320" r="32" fill="none" stroke="#DE0302" stroke-width="2" stroke-dasharray="4 3" />
  <text x="400" y="325" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">HQ</text>
  <text x="400" y="374" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="12" font-weight="700" fill="#010D3B">Thiruvallur / Chennai</text>

  <!-- Branch Node 1: Vellore Plant -->
  <circle cx="160" cy="300" r="16" fill="#FFFFFF" stroke="#010D3B" stroke-width="3.5" />
  <circle cx="160" cy="300" r="5" fill="#DE0302" />
  <text x="160" y="334" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="11" font-weight="600" fill="#010D3B">Vellore Plant</text>
  <text x="160" y="350" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="10" font-weight="600" fill="#16A34A">1.8 ms</text>

  <!-- Branch Node 2: Salem Hub -->
  <circle cx="270" cy="400" r="16" fill="#FFFFFF" stroke="#010D3B" stroke-width="3.5" />
  <circle cx="270" cy="400" r="5" fill="#DE0302" />
  <text x="270" y="432" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="11" font-weight="600" fill="#010D3B">Salem Hub</text>
  <text x="270" y="448" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="10" font-weight="600" fill="#16A34A">2.3 ms</text>

  <!-- Branch Node 3: Trichy Depot -->
  <circle cx="530" cy="400" r="16" fill="#FFFFFF" stroke="#010D3B" stroke-width="3.5" />
  <circle cx="530" cy="400" r="5" fill="#DE0302" />
  <text x="530" y="432" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="11" font-weight="600" fill="#010D3B">Trichy Depot</text>
  <text x="530" y="448" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="10" font-weight="600" fill="#16A34A">2.6 ms</text>

  <!-- Branch Node 4: Coimbatore -->
  <circle cx="640" cy="300" r="16" fill="#FFFFFF" stroke="#010D3B" stroke-width="3.5" />
  <circle cx="640" cy="300" r="5" fill="#DE0302" />
  <text x="640" y="334" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="11" font-weight="600" fill="#010D3B">Coimbatore</text>
  <text x="640" y="350" text-anchor="middle" font-family="Urbanist, system-ui, sans-serif" font-size="10" font-weight="600" fill="#16A34A">3.4 ms</text>
</svg>
